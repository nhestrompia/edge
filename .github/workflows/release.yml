name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Check the macOS toolchain
        run: |
          swift --version
          xcodebuild -version
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must use semantic versioning, for example 0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID signing certificates
        shell: bash
        env:
          APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/edge-signing.keychain-db
        run: |
          set -euo pipefail

          if [[ -z "${APPLICATION_CERTIFICATE_BASE64:-}" ||
                -z "${APPLICATION_CERTIFICATE_PASSWORD:-}" ||
                -z "${APPLICATION_IDENTITY:-}" ||
                -z "${INSTALLER_CERTIFICATE_BASE64:-}" ||
                -z "${INSTALLER_CERTIFICATE_PASSWORD:-}" ||
                -z "${INSTALLER_IDENTITY:-}" ]]; then
            echo "::error::Developer ID signing secrets are not configured. See docs/releasing.md."
            exit 1
          fi

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${APPLICATION_CERTIFICATE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id-application.p12"
          printf '%s' "${INSTALLER_CERTIFICATE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id-installer.p12"

          security create-keychain -p "${keychain_password}" "${SIGNING_KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${SIGNING_KEYCHAIN}"
          security unlock-keychain -p "${keychain_password}" "${SIGNING_KEYCHAIN}"

          security import "${RUNNER_TEMP}/developer-id-application.p12" \
            -k "${SIGNING_KEYCHAIN}" \
            -P "${APPLICATION_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security import "${RUNNER_TEMP}/developer-id-installer.p12" \
            -k "${SIGNING_KEYCHAIN}" \
            -P "${INSTALLER_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${SIGNING_KEYCHAIN}"
          security list-keychains -d user -s "${SIGNING_KEYCHAIN}" /Library/Keychains/System.keychain
          security default-keychain -s "${SIGNING_KEYCHAIN}"

          identities="$(security find-identity -v -p codesigning "${SIGNING_KEYCHAIN}")"
          printf '%s\n' "${identities}"
          if ! grep -F -- "\"${APPLICATION_IDENTITY}\"" <<<"${identities}" >/dev/null; then
            echo "::error::The configured Developer ID Application identity is not in the imported keychain."
            exit 1
          fi
          if ! grep -F -- "\"${INSTALLER_IDENTITY}\"" <<<"${identities}" >/dev/null; then
            echo "::error::The configured Developer ID Installer identity is not in the imported keychain."
            exit 1
          fi

      - name: Configure Apple notarization credentials
        shell: bash
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/edge-signing.keychain-db
        run: |
          set -euo pipefail

          if [[ -z "${NOTARY_API_KEY_BASE64:-}" ||
                -z "${NOTARY_API_KEY_ID:-}" ||
                -z "${NOTARY_ISSUER_ID:-}" ]]; then
            echo "::error::Apple notarization secrets are not configured. See docs/releasing.md."
            exit 1
          fi

          printf '%s' "${NOTARY_API_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/edge-notary-api-key.p8"
          xcrun notarytool store-credentials "edge-notary" \
            --key "${RUNNER_TEMP}/edge-notary-api-key.p8" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --keychain "${SIGNING_KEYCHAIN}"

      - name: Run tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/edge-clang-cache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/edge-swiftpm-cache
        run: |
          mkdir -p "$CLANG_MODULE_CACHE_PATH" "$SWIFTPM_MODULECACHE_OVERRIDE"
          swift test --disable-sandbox

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: arm64 x86_64
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          PKG_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY }}
          NOTARY_PROFILE: edge-notary
          NOTARY_KEYCHAIN: ${{ runner.temp }}/edge-signing.keychain-db
          REQUIRE_SIGNING: "1"
        run: Scripts/release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          artifacts=(
            "dist/edge-${RELEASE_VERSION}.dmg"
            "dist/edge-${RELEASE_VERSION}.pkg"
            "dist/edge-${RELEASE_VERSION}.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --target "$RELEASE_TARGET" \
              --title "edge $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/edge-signing.keychain-db
        run: |
          security delete-keychain "${SIGNING_KEYCHAIN}" >/dev/null 2>&1 || true
          rm -f \
            "${RUNNER_TEMP}/developer-id-application.p12" \
            "${RUNNER_TEMP}/developer-id-installer.p12" \
            "${RUNNER_TEMP}/edge-notary-api-key.p8"
